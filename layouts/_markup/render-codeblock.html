{{- $lang := or .Type "text" -}}
<div class="code-block">
  <div class="code-block-bar">
    <span class="code-block-lang">{{ $lang }}</span>
    <button class="code-block-copy" type="button" aria-label="Copy code">
      <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5.5" y="5.5" width="8" height="9" rx="1.5"></rect>
        <path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h1"></path>
      </svg>
      <span class="code-block-copy-label">copy</span>
    </button>
  </div>
  {{ transform.Highlight .Inner $lang .Options }}
</div>
